server.port=${PORT:${SERVER_PORT:8080}}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:library}
spring.datasource.password=${DB_PASSWORD:library}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-to-a-long-random-value-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.borrowing.limit=${BORROWING_LIMIT:5}
app.borrowing.days=${BORROWING_DAYS:14}
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
