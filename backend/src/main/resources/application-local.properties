server.port=${SERVER_PORT:8080}
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/library;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=false
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-to-a-long-random-value-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.borrowing.limit=${BORROWING_LIMIT:5}
app.borrowing.days=${BORROWING_DAYS:14}
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
